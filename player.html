<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypixel SkyBlock - Coop Profiler</title>
    <style>
        :root {
            --bg-dark: #0B0E14;
            --bg-card: #161C2A;
            --bg-input: #1C2436;
            --border-color: #2A364F;
            --text-main: #E2E8F0;
            --text-muted: #8E9BAE;
            --accent-gold: #F59E0B;
            --accent-gold-hover: #D97706;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 24px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.8rem;
            color: #FFFFFF;
        }
        header h1 span {
            color: var(--accent-gold);
        }
        header p {
            color: var(--text-muted);
            margin-top: 4px;
        }

        .settings-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .settings-card label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .settings-card input {
            flex: 1;
            min-width: 280px;
            padding: 8px 12px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
        }

        .settings-card input:focus {
            border-color: var(--accent-gold);
        }

        .save-btn {
            background-color: var(--accent-gold);
            border: none;
            color: #000;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }
        .save-btn:hover {
            background-color: var(--accent-gold-hover);
        }

        .coop-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .coop-btn {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .coop-btn:hover {
            border-color: var(--accent-gold);
            background-color: rgba(245, 158, 11, 0.08);
            transform: translateY(-2px);
        }

        .coop-btn.active {
            background-color: var(--accent-gold);
            color: #000;
            border-color: var(--accent-gold);
        }

        .loading {
            color: var(--accent-gold);
            font-weight: 600;
            margin-bottom: 16px;
            display: none;
        }

        .error-box {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid #EF4444;
            color: #EF4444;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }

        .results-section {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
        }

        .results-section h2 {
            font-size: 1.2rem;
            margin-bottom: 12px;
            color: var(--accent-gold);
        }

        pre {
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            color: #38BDF8;
            font-family: monospace;
            font-size: 0.9rem;
            max-height: 600px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Hypixel SkyBlock <span>Coop Profiler</span></h1>
            <p>Bezpečné zobrazení dat tvých coop členů.</p>
        </header>

        <!-- Nastavení API klíče s odkazem -->
        <div class="settings-card">
            <div class="input-group">
                <label for="apiKeyInput">Hypixel API Klíč:</label>
                <input type="password" id="apiKeyInput" placeholder="Vlož svůj API klíč...">
                <button class="save-btn" onclick="saveApiKey()">Uložit klíč</button>
            </div>
            <div class="api-help">
                Klíč si vytvoř zde: <a href="https://developer.hypixel.net/dashboard/" target="_blank" rel="noopener noreferrer">Hypixel Developer Dashboard</a>
            </div>
        </div>

        <!-- Tlačítka coop členů -->
        <div class="coop-buttons" id="coopButtonsContainer"></div>

        <div id="loadingMsg" class="loading">Načítám data z Hypixel API...</div>
        <div id="errorMsg" class="error-box"></div>

        <div class="results-section" id="resultsContainer" style="display: none;">
            <h2 id="resultTitle">Surová data z API:</h2>
            <pre id="rawJsonOutput"></pre>
        </div>
    </div>

    <script>
        // Zde si nastav svá 4 coop členů (Jméno + UUID bez pomlček)
        const coopMembers = [
            { name: "PonozkaBrix", uuid: "ba6444571f844183a13ff51ad41bc848" },
            { name: "HejtyCZE", uuid: "47b0769cd2ef4e4d88637e839b5d1c54" },
            { name: "Goromc", uuid: "444f89c6cfa94743a67136c8e727bd88" },
            { name: "_Val3rie_", uuid: "7ae8f1c37ab24777a1a6cbbeb35c23b3" },
            { name: "EndyWilliams", uuid: "703cb88ef6784fa3a28e6b2771748daa" }
        ];

        // Načtení klíče z localStorage do inputu při startu
        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('hypixel_api_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            }

            // Vygenerování tlačítek
            const container = document.getElementById('coopButtonsContainer');
            coopMembers.forEach((member) => {
                const btn = document.createElement('button');
                btn.className = 'coop-btn';
                btn.innerHTML = `👤 ${member.name}`;
                btn.onclick = () => fetchPlayerData(member.uuid, member.name, btn);
                container.appendChild(btn);
            });
        });

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('hypixel_api_key', key);
                alert("API klíč byl úspěšně uložen do tvého prohlížeče!");
            } else {
                localStorage.removeItem('hypixel_api_key');
                alert("API klíč byl smazán.");
            }
        }

        async function fetchPlayerData(uuid, playerName, clickedButton) {
            const loadingMsg = document.getElementById('loadingMsg');
            const errorMsg = document.getElementById('errorMsg');
            const resultsContainer = document.getElementById('resultsContainer');
            const rawJsonOutput = document.getElementById('rawJsonOutput');
            const resultTitle = document.getElementById('resultTitle');

            errorMsg.style.display = 'none';
            resultsContainer.style.display = 'none';

            // Získání klíče z localStorage
            const apiKey = localStorage.getItem('hypixel_api_key');

            if (!apiKey) {
                showError("Nejprve si nahoře vlož a ulož svůj Hypixel API klíč!");
                return;
            }

            document.querySelectorAll('.coop-btn').forEach(b => b.classList.remove('active'));
            loadingMsg.style.display = 'block';

            try {
                const hypixelRes = await fetch(`https://api.hypixel.net/skyblock/profiles?key=${apiKey}&uuid=${uuid}`);
                
                if (!hypixelRes.ok) {
                    throw new Error("Nepodařilo se načíst data z Hypixel API (zkontroluj, zda je tvůj API klíč správný).");
                }

                const hypixelData = await hypixelRes.json();

                if (!hypixelData.success || !hypixelData.profiles || hypixelData.profiles.length === 0) {
                    throw new Error(`Pro hráče ${playerName} nebyly nalezeny žádné SkyBlock profily (nebo má zapnuté API v nastavení).`);
                }

                resultTitle.textContent = `Surová data pro hráče: ${playerName}`;
                rawJsonOutput.textContent = JSON.stringify(hypixelData, null, 2);
                resultsContainer.style.display = 'block';
                clickedButton.classList.add('active');

            } catch (err) {
                showError(err.message);
            } finally {
                loadingMsg.style.display = 'none';
            }
        }

        function showError(message) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = message;
            errorMsg.style.display = 'block';
        }
    </script>
</body>
</html>

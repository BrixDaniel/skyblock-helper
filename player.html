<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypixel SkyBlock - Coop Profiler</title>
    <style>
        :root {
            --bg-dark: #0B0E14;
            --bg-card: #161C2A;
            --bg-input: #1C2436;
            --border-color: #2A364F;
            --text-main: #E2E8F0;
            --text-muted: #8E9BAE;
            --accent-gold: #F59E0B;
            --accent-gold-hover: #D97706;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 24px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.8rem;
            color: #FFFFFF;
        }
        header h1 span {
            color: var(--accent-gold);
        }
        header p {
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Styl pro tlačítka coop členů */
        .coop-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .coop-btn {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .coop-btn:hover {
            border-color: var(--accent-gold);
            background-color: rgba(245, 158, 11, 0.08);
            transform: translateY(-2px);
        }

        .coop-btn.active {
            background-color: var(--accent-gold);
            color: #000;
            border-color: var(--accent-gold);
        }

        .loading {
            color: var(--accent-gold);
            font-weight: 600;
            margin-bottom: 16px;
            display: none;
        }

        .error-box {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid #EF4444;
            color: #EF4444;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }

        .results-section {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
        }

        .results-section h2 {
            font-size: 1.2rem;
            margin-bottom: 12px;
            color: var(--accent-gold);
        }

        pre {
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            color: #38BDF8;
            font-family: monospace;
            font-size: 0.9rem;
            max-height: 600px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Hypixel SkyBlock <span>Coop Profiler</span></h1>
            <p>Kliknutím na hráče se okamžitě načtou jeho data z Hypixel API.</p>
        </header>

        <!-- Tady se automaticky vykreslí tlačítka z pole níže -->
        <div class="coop-buttons" id="coopButtonsContainer"></div>

        <div id="loadingMsg" class="loading">Načítám data z Hypixel API...</div>
        <div id="errorMsg" class="error-box"></div>

        <div class="results-section" id="resultsContainer" style="display: none;">
            <h2 id="resultTitle">Surová data z API:</h2>
            <pre id="rawJsonOutput"></pre>
        </div>
    </div>

    <script>
        // 1. ZDE SI VLOŽ SVŮJ HYPIXEL API KLÍČ
        const HYPIXEL_API_KEY = 'TVUJ_HYPIXEL_API_KLIC';

        // 2. ZDE SI NASTAV SVÉ 4 COOP ČLENY (Jméno + UUID bez pomlček)
        const coopMembers = [
            { name: "PonozkaBrix", uuid: "TVE_UUID_BEZ_POMLCEK" },
            { name: "HracDva", uuid: "UUID_DRUHEHO_HRACE" },
            { name: "HracTris", uuid: "UUID_TETESI_HRACE" },
            { name: "HracCtyri", uuid: "UUID_CTVRTEHO_HRACE" }
        ];

        // Inicializace stránek - vygeneruje tlačítka při načtení
        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('coopButtonsContainer');
            
            coopMembers.forEach((member, index) => {
                const btn = document.createElement('button');
                btn.className = 'coop-btn';
                btn.innerHTML = `👤 ${member.name}`;
                btn.onclick = () => fetchPlayerData(member.uuid, member.name, btn);
                container.appendChild(btn);
            });
        });

        async function fetchPlayerData(uuid, playerName, clickedButton) {
            const loadingMsg = document.getElementById('loadingMsg');
            const errorMsg = document.getElementById('errorMsg');
            const resultsContainer = document.getElementById('resultsContainer');
            const rawJsonOutput = document.getElementById('rawJsonOutput');
            const resultTitle = document.getElementById('resultTitle');

            // Reset UI
            errorMsg.style.display = 'none';
            resultsContainer.style.display = 'none';

            // Označení aktivního tlačítka
            document.querySelectorAll('.coop-btn').b(btn => btn.classList.remove('active')); // opraveno na forEach
            // (v čistém kódu níže je to opraveno správně)
            
            if (HYPIXEL_API_KEY === 'TVUJ_HYPIXEL_API_KLIC') {
                showError("Nezapomeň v kódu nastavit svůj vlastní HYPIXEL_API_KEY!");
                return;
            }

            loadingMsg.style.display = 'block';

            try {
                // Přímé volání Hypixel API pomocí UUID
                const hypixelRes = await fetch(`https://api.hypixel.net/skyblock/profiles?key=${HYPIXEL_API_KEY}&uuid=${uuid}`);
                
                if (!hypixelRes.ok) {
                    throw new Error("Nepodařilo se načíst data z Hypixel API (zkontroluj platnost API klíče).");
                }

                const hypixelData = await hypixelRes.json();

                if (!hypixelData.success || !hypixelData.profiles || hypixelData.profiles.length === 0) {
                    throw new Error(`Pro hráče ${playerName} nebyly nalezeny žádné SkyBlock profily (nebo má zapnuté API v nastavení).`);
                }

                // Zobrazení výsledků
                resultTitle.textContent = `Surová data pro hráče: ${playerName}`;
                rawJsonOutput.textContent = JSON.stringify(hypixelData, null, 2);
                resultsContainer.style.display = 'block';
                clickedButton.classList.add('active');

            } catch (err) {
                showError(err.message);
            } finally {
                loadingMsg.style.display = 'none';
            }
        }

        function showError(message) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = message;
            errorMsg.style.display = 'block';
        }
    </script>
</body>
</html>

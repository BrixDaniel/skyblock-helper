<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypixel SkyBlock - Coop Profiler</title>
    <style>
        :root {
            --bg-dark: #0B0E14;
            --bg-card: #161C2A;
            --bg-input: #1C2436;
            --border-color: #2A364F;
            --text-main: #E2E8F0;
            --text-muted: #8E9BAE;
            --accent-gold: #F59E0B;
            --accent-gold-hover: #D97706;
            --profile-active: #1E293B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 24px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.8rem;
            color: #FFFFFF;
        }
        header h1 span {
            color: var(--accent-gold);
        }
        header p {
            color: var(--text-muted);
            margin-top: 4px;
        }

        .settings-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            width: 100%;
        }

        .input-group label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .input-group input {
            flex: 1;
            min-width: 280px;
            padding: 8px 12px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--accent-gold);
        }

        .save-btn {
            background-color: var(--accent-gold);
            border: none;
            color: #000;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }
        .save-btn:hover {
            background-color: var(--accent-gold-hover);
        }

        .api-help {
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .api-help a {
            color: var(--accent-gold);
            text-decoration: underline;
        }

        .coop-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .coop-btn {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .coop-btn:hover {
            border-color: var(--accent-gold);
            background-color: rgba(245, 158, 11, 0.08);
            transform: translateY(-2px);
        }

        .coop-btn.active {
            background-color: var(--accent-gold);
            color: #000;
            border-color: var(--accent-gold);
        }

        .loading {
            color: var(--accent-gold);
            font-weight: 600;
            margin-bottom: 16px;
            display: none;
        }

        .error-box {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid #EF4444;
            color: #EF4444;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }

        /* Sekce pro dlaždice profilů */
        .results-section {
            display: none;
            margin-top: 24px;
        }

        .results-section h2 {
            font-size: 1.2rem;
            margin-bottom: 16px;
            color: var(--accent-gold);
        }

        .profiles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .profile-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .profile-card:hover {
            border-color: var(--accent-gold);
            transform: translateY(-2px);
        }

        .profile-card.selected {
            border-color: var(--accent-gold);
            background-color: var(--profile-active);
        }

        .profile-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: #FFFFFF;
            margin-bottom: 6px;
            text-transform: capitalize;
        }

        .profile-id {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-family: monospace;
        }

        .profile-mode {
            display: inline-block;
            background-color: rgba(56, 189, 248, 0.1);
            color: #38BDF8;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* Detail vybraného profilu (JSON) */
        .profile-detail {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
        }

        .profile-detail h3 {
            font-size: 1rem;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        pre {
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            color: #38BDF8;
            font-family: monospace;
            font-size: 0.9rem;
            max-height: 400px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Hypixel SkyBlock <span>Coop Profiler</span></h1>
            <p>Securely view and explore your coop members' SkyBlock profiles.</p>
        </header>

        <!-- API Key Settings Card -->
        <div class="settings-card">
            <div class="input-group">
                <label for="apiKeyInput">Hypixel API Key:</label>
                <input type="password" id="apiKeyInput" placeholder="Enter your personal API key...">
                <button class="save-btn" onclick="saveApiKey()">Save Key</button>
            </div>
            <div class="api-help">
                You can get your free API key at the <a href="https://developer.hypixel.net/dashboard/" target="_blank" rel="noopener noreferrer">Hypixel Developer Dashboard</a>.
            </div>
        </div>

        <!-- Coop Members Buttons -->
        <div class="coop-buttons" id="coopButtonsContainer"></div>

        <div id="loadingMsg" class="loading">Loading data from Hypixel API...</div>
        <div id="errorMsg" class="error-box"></div>

        <!-- Profiles Grid & Detail Section -->
        <div class="results-section" id="resultsContainer">
            <h2 id="resultTitle">Profiles found:</h2>
            <div class="profiles-grid" id="profilesGridContainer"></div>

            <div class="profile-detail" id="profileDetailContainer" style="display: none;">
                <h3 id="detailTitle">Raw Data for Selected Profile:</h3>
                <pre id="rawJsonOutput"></pre>
            </div>
        </div>
    </div>

    <script>
        // Define your 4 coop members (Name + UUID without dashes)
        const coopMembers = [
            { name: "PonozkaBrix", uuid: "TVE_UUID_BEZ_POMLCEK" },
            { name: "HracDva", uuid: "UUID_DRUHEHO_HRACE" },
            { name: "HracTris", uuid: "UUID_TETESI_HRACE" },
            { name: "HracCtyri", uuid: "UUID_CTVRTEHO_HRACE" }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('hypixel_api_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            }

            const container = document.getElementById('coopButtonsContainer');
            coopMembers.forEach((member) => {
                const btn = document.createElement('button');
                btn.className = 'coop-btn';
                btn.innerHTML = `👤 ${member.name}`;
                btn.onclick = () => fetchPlayerData(member.uuid, member.name, btn);
                container.appendChild(btn);
            });
        });

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('hypixel_api_key', key);
                alert("API key successfully saved to your browser local storage!");
            } else {
                localStorage.removeItem('hypixel_api_key');
                alert("API key removed.");
            }
        }

        async function fetchPlayerData(uuid, playerName, clickedButton) {
            const loadingMsg = document.getElementById('loadingMsg');
            const errorMsg = document.getElementById('errorMsg');
            const resultsContainer = document.getElementById('resultsContainer');
            const profilesGridContainer = document.getElementById('profilesGridContainer');
            const profileDetailContainer = document.getElementById('profileDetailContainer');

            errorMsg.style.display = 'none';
            resultsContainer.style.display = 'none';
            profileDetailContainer.style.display = 'none';
            profilesGridContainer.innerHTML = '';

            const apiKey = localStorage.getItem('hypixel_api_key');

            if (!apiKey) {
                showError("Please enter and save your Hypixel API Key first!");
                return;
            }

            document.querySelectorAll('.coop-btn').forEach(b => b.classList.remove('active'));
            loadingMsg.style.display = 'block';

            try {
                const hypixelRes = await fetch(`https://api.hypixel.net/v2/skyblock/profiles?uuid=${uuid}`, {
                    headers: {
                        'API-Key': apiKey
                    }
                });
                
                if (!hypixelRes.ok) {
                    throw new Error(`Hypixel API returned error ${hypixelRes.status}: ${hypixelRes.statusText}`);
                }

                const hypixelData = await hypixelRes.json();

                if (!hypixelData.success || !hypixelData.profiles || hypixelData.profiles.length === 0) {
                    throw new Error(`No SkyBlock profiles found for player ${playerName} (or API is disabled in game settings).`);
                }

                // Render profile tiles
                document.getElementById('resultTitle').textContent = `Profiles for ${playerName}:`;
                
                hypixelData.profiles.forEach((profile, index) => {
                    const profileName = profile.cute_name || `Profile ${index + 1}`;
                    const gameMode = profile.game_mode || 'normal';
                    const profileId = profile.profile_id;

                    const card = document.createElement('div');
                    card.className = 'profile-card';
                    card.innerHTML = `
                        <div class="profile-name">🌿 ${profileName}</div>
                        <div class="profile-id">ID: ${profileId.substring(0, 8)}...</div>
                        <span class="profile-mode">${gameMode}</span>
                    `;

                    // Click on tile shows raw data for this specific profile
                    card.onclick = () => {
                        document.querySelectorAll('.profile-card').forEach(c => c.classList.remove('selected'));
                        card.classList.add('selected');
                        
                        document.getElementById('detailTitle').textContent = `Raw Data for Profile: ${profileName}`;
                        document.getElementById('rawJsonOutput').textContent = JSON.stringify(profile, null, 2);
                        profileDetailContainer.style.display = 'block';
                    };

                    profilesGridContainer.appendChild(card);
                });

                resultsContainer.style.display = 'block';
                clickedButton.classList.add('active');

            } catch (err) {
                showError(err.message);
            } finally {
                loadingMsg.style.display = 'none';
            }
        }

        function showError(message) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = message;
            errorMsg.style.display = 'block';
        }
    </script>
</body>
</html>

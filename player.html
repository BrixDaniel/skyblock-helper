<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypixel SkyBlock - Profile Viewer</title>
    <style>
        :root {
            --bg-dark: #0B0E14;
            --bg-card: #161C2A;
            --bg-input: #1C2436;
            --border-color: #2A364F;
            --text-main: #E2E8F0;
            --text-muted: #8E9BAE;
            --accent-gold: #F59E0B;
            --accent-gold-hover: #D97706;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 24px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.8rem;
            color: #FFFFFF;
        }
        header h1 span {
            color: var(--accent-gold);
        }
        header p {
            color: var(--text-muted);
            margin-top: 4px;
        }

        .search-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 12px;
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-card input {
            flex: 1;
            min-width: 250px;
            padding: 12px 16px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }

        .search-card input:focus {
            border-color: var(--accent-gold);
        }

        .search-card button {
            background-color: var(--accent-gold);
            border: none;
            color: #000;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-card button:hover {
            background-color: var(--accent-gold-hover);
        }

        .loading {
            color: var(--accent-gold);
            font-weight: 600;
            margin-bottom: 16px;
            display: none;
        }

        .error-box {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid #EF4444;
            color: #EF4444;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }

        .results-section {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
        }

        .results-section h2 {
            font-size: 1.2rem;
            margin-bottom: 12px;
            color: var(--accent-gold);
        }

        pre {
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            color: #38BDF8;
            font-family: monospace;
            font-size: 0.9rem;
            max-height: 600px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Hypixel SkyBlock <span>Player Explorer</span></h1>
            <p>Zadej své Minecraft jméno.</p>
        </header>

        <div class="search-card">
            <input type="text" id="mcUsername" placeholder="Zadej Minecraft jméno (např. Technoblade)...">
            <button id="searchBtn" onclick="fetchPlayerData()">Načíst profily</button>
        </div>

        <div id="loadingMsg" class="loading">Načítám data z Mojang a Hypixel API...</div>
        <div id="errorMsg" class="error-box"></div>

        <div class="results-section" id="resultsContainer" style="display: none;">
            <h2>Kompletní surová data z API (Pro rozhodnutí, co ponechat):</h2>
            <pre id="rawJsonOutput"></pre>
        </div>
    </div>

    <script>
        const HYPIXEL_API_KEY = '5f23c46c-4f26-4602-8857-7d261c885074';

        async function fetchPlayerData() {
            const username = document.getElementById('mcUsername').value.trim();
            const loadingMsg = document.getElementById('loadingMsg');
            const errorMsg = document.getElementById('errorMsg');
            const resultsContainer = document.getElementById('resultsContainer');
            const rawJsonOutput = document.getElementById('rawJsonOutput');

            // Reset UI
            errorMsg.style.display = 'none';
            resultsContainer.style.display = 'none';

            if (!username) {
                showError("Prosím zadej platné Minecraft jméno.");
                return;
            }

            if (HYPIXEL_API_KEY === '5f23c46c-4f26-4602-8857-7d261c885074') {
                showError("Nezapomeň v kódu nastavit svůj vlastní HYPIXEL_API_KEY!");
                return;
            }

            loadingMsg.style.display = 'block';

            try {
                // 1. Krok: Převod jména na UUID přes Mojang API
                // Poznámka: Pro obcházení CORS v prohlížeči se někdy používá CORS proxy, nebo přímé volání, pokud to prohlížeč dovolí.
                const mojangRes = await fetch(`https://api.mojang.com/users/profiles/minecraft/${encodeURIComponent(username)}`);
                
                if (!mojangRes.ok) {
                    throw new Error("Hráč s tímto jménem nebyl v Minecraftu nalezen.");
                }

                const mojangData = await mojangRes.json();
                const uuid = mojangData.id; // UUID bez pomlček

                // 2. Krok: Volání Hypixel SkyBlock Profiles API
                const hypixelRes = await fetch(`https://api.hypixel.net/skyblock/profiles?key=${HYPIXEL_API_KEY}&uuid=${uuid}`);
                
                if (!hypixelRes.ok) {
                    throw new Error("Nepodařilo se načíst data z Hypixel API (zkontroluj platnost API klíče).");
                }

                const hypixelData = await hypixelRes.json();

                if (!hypixelData.success || !hypixelData.profiles || hypixelData.profiles.length === 0) {
                    throw new Error("Pro tohoto hráče nebývaly nalezeny žádné SkyBlock profily (nebo má zapnuté API v nastavení hry).");
                }

                // Zobrazení výsledků
                rawJsonOutput.textContent = JSON.stringify(hypixelData, null, 2);
                resultsContainer.style.display = 'block';

            } catch (err) {
                showError(err.message);
            } finally {
                loadingMsg.style.display = 'none';
            }
        }

        function showError(message) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = message;
            errorMsg.style.display = 'block';
        }

        // Umožnit odeslání formuláře klávesou Enter
        document.getElementById('mcUsername').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                fetchPlayerData();
            }
        });
    </script>
</body>
</html>

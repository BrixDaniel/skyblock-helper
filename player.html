<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypixel SkyBlock - Coop Profiler</title>
    <style>
        :root {
            --bg-dark: #0B0E14;
            --bg-card: #161C2A;
            --border-color: #2A364F;
            --text-main: #E2E8F0;
            --text-muted: #8E9BAE;
            --accent-gold: #F59E0B;
            --accent-gold-hover: #D97706;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 24px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        header h1 {
            font-size: 2rem;
            color: #FFFFFF;
        }

        header h1 span {
            color: var(--accent-gold);
        }

        header p {
            color: var(--text-muted);
            margin-top: 8px;
            font-size: 0.95rem;
        }

        .title-group p {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .coop-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .coop-card h2 {
            font-size: 1.2rem;
            color: var(--text-main);
            margin-bottom: 20px;
        }

        .coop-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .coop-btn {
            background-color: #1C2436;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
        }

        .coop-btn:hover {
            border-color: var(--accent-gold);
            background-color: rgba(245, 158, 11, 0.08);
            color: var(--accent-gold);
            transform: translateY(-2px);
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #F97316 0%, #C2410C 100%); /* barva podle stránky */
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 14px rgba(249, 115, 22, 0.3);
            font-size: 24px;
            text-decoration: none; /* odstraní podtržení odkazu */
            transition: transform 0.2s, filter 0.2s;
        }

        .logo-icon:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
        }
        
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <a href="index.html" class="logo-icon">🔍</a>
                <div class="title-group">
                    <h1>Hypixel SkyBlock <span>Coop Profiler</span></h1>
                    <p>Kliknutím na hráče otevřete jeho SkyCrypt profil v nové záložce.</p>
                </div>
            </div>
        </header>

        <div class="coop-card">
            <h2>Vyberte člena Coop týmu</h2>
            <!-- Coop Members Buttons Container -->
            <div class="coop-buttons" id="coopButtonsContainer"></div>
        </div>
    </div>

    <script>
        // Seznam vašich hráčů (jména se použijí pro sestavení SkyCrypt URL)
        const coopMembers = [
            { name: "PonozkaBrix" },
            { name: "HejtyCZE" },
            { name: "Goromc" },
            { name: "_Val3rie_" },
            { name: "EndyWilliams" }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('coopButtonsContainer');
            
            coopMembers.forEach((member) => {
                const link = document.createElement('a');
                link.className = 'coop-btn';
                link.href = `https://sky.shiiyu.moe/stats/${member.name}`;
                link.target = '_blank'; // Otevře v nové kartě
                link.rel = 'noopener noreferrer';
                link.innerHTML = `👤 ${member.name} <span style="font-size: 0.8rem; opacity: 0.7; margin-left: auto;">↗ SkyCrypt</span>`;
                
                container.appendChild(link);
            });
        });
    </script>
</body>
</html>
